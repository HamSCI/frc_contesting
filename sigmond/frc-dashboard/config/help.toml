# Wizard help for `smd tui` / `frc-dashboard config` (ADD-A-CLIENT §8).

[server.bind]
title          = "Listen address"
help           = """0.0.0.0 serves the dashboard to the station LAN; 127.0.0.1
restricts it to this host (reach it through an SSH tunnel)."""
example        = "0.0.0.0"

[server.port]
title          = "HTTP port"
help           = "Browse to http://<host>:<port>/ . 8000/8081/8082 are already used by sigmond services on W3USR-06."
example        = "5000"
validator_hint = "1-65535, unused"

[server.workers]
title  = "gunicorn worker processes"
hidden = true

[server.threads]
title  = "Threads per worker"
hidden = true

[server.timeout_sec]
title  = "Request timeout (s)"
hidden = true

[station.callsign]
title   = "Receiver callsign override"
help    = "Blank uses sigmond's STATION_REPORTER_ID (e.g. W3USR/06)."
example = "W3USR/06"

[station.grid_square]
title   = "Receiver grid override"
help    = "Blank uses sigmond's STATION_GRID. Sets the receiver marker on the map."
example = "FN21ej"

[app.root]
title  = "Dashboard app checkout"
hidden = true

[waterfall.enabled]
title = "Waterfall tab"
help  = """Live spectrum waterfalls of the contest bands, from radiod spectrum
channels.  The channels exist only while someone has the Waterfall tab open
and are removed after idle_timeout_sec.  Each band costs radiod CPU, so turn
this off on a station whose radiod is already near its limit."""

[waterfall.radiod_status]
title  = "radiod status address"
hidden = true

[waterfall.bands]
title          = "Bands shown"
help           = "Comma-separated subset of 160m,80m,40m,20m,15m,10m."
example        = "160m,80m,40m,20m,15m,10m"

[waterfall.bins]
title          = "Bins per band"
help           = "Horizontal resolution.  radiod CPU grows with bins x bands."
example        = "800"

[waterfall.poll_sec]
title  = "Seconds per waterfall row"
hidden = true

[waterfall.averaging]
title  = "FFTs averaged per row"
hidden = true

[waterfall.idle_timeout_sec]
title  = "Idle timeout (s)"
hidden = true

[waterfall.history_rows]
title  = "Rows kept per band"
help   = """History the Waterfall tab can show when opened (1800 rows = 60 min at
one row per 2 s).  Memory only, about 1.4 MB per band at 800 bins; it does
not add radiod load.  History is lost when the channels are released after
idle_timeout_sec with no viewer."""
hidden = true

[listen.enabled]
title = "Click-to-listen"
help  = """Lets Waterfall-tab users click a band to hear it (USB/LSB/CW/AM).
Each listener gets one ordinary radiod audio channel at 12 kHz, released
when they stop or leave the page."""

[listen.max_listeners]
title          = "Simultaneous listeners"
help           = """Each listener holds one radiod audio channel and one
gunicorn thread (2 workers x 4 threads by default) for its audio stream."""
example        = "2"
validator_hint = "1-4"

[listen.idle_timeout_sec]
title  = "Listener idle timeout (s)"
hidden = true

[skimmer.enabled]
title = "Skimmer tab (CW skimmer)"
help  = """Decodes every CW signal in one band's CW segment at once and spots
callsigns that call CQ (the bottom 70 kHz of the band).  Uses one radiod IQ channel (96 kHz, an ordinary
channel like the recorders'; 0 radiod drops measured on W3USR-06) and about
12 % of one CPU core, only while someone has the Skimmer tab open unless
always_on is set."""

[skimmer.band]
title   = "Starting band"
help    = "One of 160m,80m,40m,20m,15m,10m.  The Skimmer tab can change it."
example = "20m"

[skimmer.idle_timeout_sec]
title  = "Stop after (s) without a viewer"
hidden = true

[skimmer.always_on]
title = "Run without viewers"
help  = """Keep skimming when nobody has the tab open.  Needed if spots are to be
fed to a logging program or the RBN Aggregator through telnet_port."""

[skimmer.detect_db]
title  = "Detection threshold (dB per ~94 Hz bin)"
hidden = true

[skimmer.max_signals]
title  = "Most signals decoded at once"
hidden = true

[skimmer.spotter]
title   = "Spotter callsign"
help    = "Blank uses the station callsign without any /suffix, as RBN skimmers do (W3USR/06 -> W3USR)."
example = "W3USR"

[skimmer.scp_file]
title   = "Callsign list (optional)"
help    = """A MASTER.SCP-style file, one call per line.  Skimmed calls found in it
(or heard on WSPR/FT8 by this station) are confirmed at once; others need
two copies on the same frequency."""
example = "/etc/frc-dashboard/MASTER.SCP"

[skimmer.telnet_port]
title   = "Spot feed telnet port (0 = off)"
help    = """Serve confirmed spots as a DX-cluster telnet feed in the Reverse Beacon
Network / CW Skimmer format.  This is the interface the RBN Aggregator
reads; nothing is uploaded by the dashboard itself.  Leave 0 unless you
mean to connect a logger or an Aggregator."""
example = "7300"

[skimmer.telnet_bind]
title  = "Spot feed listen address"
hidden = true
