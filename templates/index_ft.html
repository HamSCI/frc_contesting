<!DOCTYPE html>
<html lang="en" class="map-page">
<head>
  <meta charset="UTF-8">
  <title>WSPR RX Station Map</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <script src="js/turf.min.js"></script>
</head>
<body class="map-page" data-grid="{{ grid }}">

  <div class="panel-header">
    <h1 class="page-title" id="title">WSPR Spots From PSWS Receiver</h1>
    <div class="status-bar">
      Connection Status:&nbsp;<span id="conn-status-dot" class="status-dot status-checking"></span><span id="conn-status-label">Checking...</span>
      &nbsp;&nbsp;|&nbsp;&nbsp;<span id="last-updated">Last updated: —</span>
    </div>
    <h3 id="spot-info" class="status-line">Loading spot data...</h3>
  </div>

  <div class="controls-center">
    <div class="field">
      <label for="lastInterval">Last Minutes</label>
      <input id="lastInterval" type="number" value="15" min="1">
    </div>


    <div class="field">
      <label for="countryFilter">Country</label>
      <select id="countryFilter">
        <option value="">All Countries</option>
        <option value="nonUS">All but US</option>
        <option value="United States of America">United States of America</option>
        <option value="Canada">Canada</option>
        <option value="Mexico">Mexico</option>
        <option value="Germany">Germany</option>
        <option value="Antigua">Antigua</option>
        <option value="Brazil">Brazil</option>
        <option value="Namibia">Namibia</option>
        <option value="Japan">Japan</option>
        <option value="China">China</option>
        <option value="Russian Federation">Asiatic Russia</option>
        <option value="India">India</option>
        <option value="Qatar">Qatar</option>
        <option value="Thailand">Thailand</option>
      </select>
    </div>

    <div class="field">
      <label for="continentFilter">Continent</label>
      <select id="continentFilter">
        <option value="">All Continents</option>
        <option value="North America">North America</option>
        <option value="South America">South America</option>
        <option value="Europe">Europe</option>
        <option value="Asia">Asia</option>
        <option value="Africa">Africa</option>
        <option value="Oceania">Oceania</option>
        <option value="Antarctica">Antarctica</option>
      </select>
    </div>

    <div class="field">
      <label for="cqZoneFilter">CQ Zone</label>
      <select id="cqZoneFilter">
        <option value="">All CQ Zones</option>
      </select>
    </div>

    <div class="check-field">
      <input type="checkbox" id="cqOutline">
      <label for="cqOutline">CQ Zone Outline</label>
    </div>

    <div class="field">
      <label for="ITUZoneFilter">ITU Zone</label>
      <select id="ITUZoneFilter">
        <option value="">All ITU Zones</option>
      </select>
    </div>

    <div class="check-field">
      <input type="checkbox" id="ituOutline">
      <label for="ituOutline">ITU Zone Outline</label>
    </div>

    <div class="field" title="Great circle: centred on this station; direction = beam heading, distance = great-circle distance">
      <label for="projection">Projection</label>
      <select id="projection">
        <option value="ae">Great circle</option>
        <option value="merc">Mercator</option>
      </select>
    </div>

    <div class="check-field" title="Day/night terminator (gray line) with civil, nautical and astronomical twilight">
      <input type="checkbox" id="terminatorToggle" checked>
      <label for="terminatorToggle">Gray line</label>
    </div>

    <div class="check-field" title="OVATION aurora forecast (NOAA SWPC, fetched by the server; needs internet there)">
      <input type="checkbox" id="auroraToggle">
      <label for="auroraToggle">Aurora</label>
    </div>

    <div class="field">
      <label for="reloadInterval">Auto Reload</label>
      <select id="reloadInterval">
        <option value="0">Off</option>
        <option value="120">Every 2 min</option>
        <option value="300">Every 5 min</option>
        <option value="600">Every 10 min</option>
        <option value="900">Every 15 min</option>
        <option value="1800">Every 30 min</option>
      </select>
    </div>

    <!-- any combination of bands (#60): chips generated from CONFIG.bands -->
    <div class="band-row">
      <span class="band-row-label">Bands</span>
      <div class="band-chips" id="bandChips" role="group" aria-label="Bands"></div>
    </div>

    <!-- one pill per mode, generated from CONFIG.modes (#67) -->
    <div class="mode-group" id="modePills"></div>

    <button id="updateButton" class="btn-primary">Update</button>
  </div>

  <div class="map-card">
    <div id="map"></div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/viewstate.js"></script>
  <script src="js/solar.js"></script>
  <script src="js/aeqd.js"></script>
  <script src="js/spot_symbols.js"></script>
  <script src="js/map_ft.js"></script>

</body>
</html>
