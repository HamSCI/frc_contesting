<!DOCTYPE html>
<html lang="en" class="dashboard-page">
<head>
  <meta charset="UTF-8">
  <title>PSWS Contesting Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

  <nav class="dash-nav">
    <div class="dash-brand">HamSCI PSWS Dashboard<span class="dash-brand-sub">Contesting &amp; DXing</span></div>
    <div class="dash-tabs">
      <button class="dash-tab-btn active" data-target="map-frame">Map</button>
      <button class="dash-tab-btn" data-target="table-frame">Table</button>
    </div>
  </nav>

  <div class="dash-frames">
    <iframe id="map-frame" class="dash-frame active" src="/map"></iframe>
    <iframe id="table-frame" class="dash-frame" src="/table"></iframe>
  </div>

  <script src="js/dashboard.js"></script>

</body>
</html>
