<!DOCTYPE html>
<html lang="en" class="dashboard-page">
<head>
  <meta charset="UTF-8">
  <title>PSWS Contesting Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-page">

  <nav class="dash-nav">
    <div class="dash-brand">HamSCI PSWS Dashboard<span class="dash-brand-sub">Contesting &amp; DXing</span></div>
    <div class="dash-tabs">
      <button class="dash-tab-btn active" data-target="map-frame" data-view="map">Map</button>
      <button class="dash-tab-btn" data-target="table-frame" data-view="table">Table</button>
      <button class="dash-tab-btn" data-target="states-frame" data-view="states" title="US states and Canadian provinces heard, and which are missing (ARRL Sweepstakes)">States</button>
      <button class="dash-tab-btn" data-target="waterfall-frame" data-view="waterfall">Waterfall</button>
    </div>
    <label class="dash-setting" for="bandLabels" title="How bands are labelled on every tab">Band labels
      <select id="bandLabels">
        <option value="both">14 MHz · 20 m</option>
        <option value="freq">14 MHz</option>
        <option value="wl">20 m</option>
      </select>
    </label>
    <button id="copyLink" class="dash-link-btn" type="button" title="Copy a link to this exact view and settings">Copy link</button>
  </nav>

  <div class="dash-frames">
    <!-- The page's query string (all view settings, #62) is passed to every frame. -->
    <iframe id="map-frame" class="dash-frame active" data-view="map" src="/map{{ qs }}"></iframe>
    <iframe id="table-frame" class="dash-frame" data-view="table" src="/table{{ qs }}"></iframe>
    <iframe id="states-frame" class="dash-frame" data-view="states" data-src="/states{{ qs }}"></iframe>
    <!-- Loaded on first use: it opens radiod spectrum channels while watched. -->
    <iframe id="waterfall-frame" class="dash-frame" data-view="waterfall" data-src="/waterfall{{ qs }}"></iframe>
  </div>

  <script src="js/config.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
