<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WSPR Map + Table</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/leaflet.extra-markers.min.css">
  <script src="js/turf.min.js"></script>
  <script>window.UNIFIED_PAGE = true;</script>
</head>

<body class="unified-page">

  <button id="hamburger-btn" onclick="toggleNav()">&#9776;</button>
  <div id="nav-overlay" onclick="closeNav()"></div>
  <nav id="nav-panel">
    <a href="/">Spots</a>
    <a href="/prediction">Prediction</a>
  </nav>

  <!-- Shared Controls Bar -->
  <div id="shared-controls">
    <label for="lastInterval">Last Minutes:</label>
    <input id="lastInterval" type="number" value="15" min="1" class="narrow-input">
    &nbsp;&nbsp;
    <label><input type="checkbox" id="modeWSPR" checked> WSPR</label>
    <label><input type="checkbox" id="modeFT8" checked> FT8</label>
    <label><input type="checkbox" id="modeFT4" checked> FT4</label>
    &nbsp;&nbsp;
    <label><input type="checkbox" id="predictionOverlay"> Prediction Overlay</label>
    &nbsp;&nbsp;
    <label for="reloadInterval">Auto Reload:</label>
    <select id="reloadInterval">
      <option value="0">Off</option>
      <option value="120">Every 2 min</option>
      <option value="300">Every 5 min</option>
      <option value="600">Every 10 min</option>
      <option value="900">Every 15 min</option>
      <option value="1800">Every 30 min</option>
    </select>
    &nbsp;&nbsp;
    <button id="updateButton">Update</button>
  </div>

  <!-- MAP SECTION -->
  <section id="map-section">
    <h1 class="page-title" id="map-title">WSPR Spots From PSWS Receiver</h1>
    <div class="status-bar">
      Connection:&nbsp;<span id="map-conn-status-dot" class="status-dot status-checking"></span><span id="map-conn-status-label">Checking...</span>
      &nbsp;&nbsp;|&nbsp;&nbsp;<span id="map-last-updated">Last updated: —</span>
    </div>
    <h3 id="map-spot-info" class="page-title">Loading spot data...</h3>

    <div class="controls-center">
      <label for="bandFilter">Filter Band:</label>
      <select id="bandFilter">
        <option value="">All Bands</option>
        <option value="CBs">Contest Bands</option>
        <option value="2200m">2200m</option>
        <option value="630m">630m</option>
        <option value="160m">160m</option>
        <option value="80m">80m</option>
        <option value="60m">60m</option>
        <option value="40m">40m</option>
        <option value="30m">30m</option>
        <option value="20m">20m</option>
        <option value="17m">17m</option>
        <option value="15m">15m</option>
        <option value="12m">12m</option>
        <option value="10m">10m</option>
        <option value="6m">6m</option>
        <option value="2m">2m</option>
      </select>
      <label for="countryFilter">Country:</label>
      <select id="countryFilter">
        <option value="">All Countries</option>
        <option value="nonUS">All but US</option>
        <option value="United States of America">United States of America</option>
        <option value="Canada">Canada</option>
        <option value="Mexico">Mexico</option>
        <option value="Germany">Germany</option>
        <option value="Antigua">Antigua</option>
        <option value="Brazil">Brazil</option>
        <option value="Namibia">Namibia</option>
        <option value="Japan">Japan</option>
        <option value="China">China</option>
        <option value="Russian Federation">Asiatic Russia</option>
        <option value="India">India</option>
        <option value="Qatar">Qatar</option>
        <option value="Thailand">Thailand</option>
      </select>
      <label for="continentFilter">Continent:</label>
      <select id="continentFilter">
        <option value="">All Continents</option>
        <option value="North America">North America</option>
        <option value="South America">South America</option>
        <option value="Europe">Europe</option>
        <option value="Asia">Asia</option>
        <option value="Africa">Africa</option>
        <option value="Oceania">Oceania</option>
        <option value="Antarctica">Antarctica</option>
      </select>
      <br>
      <label for="cqZoneFilter">CQ Zone:</label>
      <select id="cqZoneFilter">
        <option value="">All CQ Zones</option>
      </select>
      <label for="cqOutline">CQ Zone Outline:</label>
      <input type="checkbox" id="cqOutline">
      <label for="ITUZoneFilter">ITU Zone:</label>
      <select id="ITUZoneFilter">
        <option value="">All ITU Zones</option>
      </select>
      <label for="ituOutline">ITU Zone Outline:</label>
      <input type="checkbox" id="ituOutline">
      <div id="area-pred-control" class="pred-sub-control">
        <label><input type="checkbox" id="areaPredOverlay"> Area Prediction Overlay</label>
      </div>
    </div>

    <div class="map-frame">
      <div id="map"></div>
    </div>
  </section>

  <div id="divider"></div>

  <!-- TABLE SECTION -->
  <section id="table-section">
    <h1 class="page-title" id="table-title">WSPR Spots Table</h1>
    <div class="status-bar">
      Connection:&nbsp;<span id="table-conn-status-dot" class="status-dot status-checking"></span><span id="table-conn-status-label">Checking...</span>
      &nbsp;&nbsp;|&nbsp;&nbsp;<span id="table-last-updated">Last updated: —</span>
    </div>

    <div id="table-controls">
      <label for="threshold">Green Threshold:</label>
      <input id="threshold" type="number" value="1" min="0" class="narrow-input">
      <div id="path-pred-control" class="pred-sub-control">
        <label><input type="checkbox" id="pathPredOverlay"> Path Prediction Overlay</label>
      </div>
    </div>

    <div id="totalDisplay" class="total-display"></div>
    <div id="spotsTableContainer" class="spots-table-container"></div>
  </section>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/map_ft.js"></script>
  <script src="js/leaflet.extra-markers.min.js"></script>
  <script src="js/table_ft.js"></script>

  <script>
    function toggleNav() {
      document.getElementById('nav-panel').classList.toggle('open');
      document.getElementById('nav-overlay').classList.toggle('open');
    }
    function closeNav() {
      document.getElementById('nav-panel').classList.remove('open');
      document.getElementById('nav-overlay').classList.remove('open');
    }

    // Unified update: map's own listener handles map-specific filter saves + mapLoadSpots().
    // We add a second listener here for the table.
    document.getElementById('updateButton').addEventListener('click', () => {
      tableLoadSpots();
    });

    // Prediction overlay master toggle — reveals section-specific sub-checkboxes.
    document.getElementById('predictionOverlay').addEventListener('change', function () {
      const show = this.checked;
      document.getElementById('area-pred-control').style.display = show ? 'inline' : 'none';
      document.getElementById('path-pred-control').style.display = show ? 'inline' : 'none';
      if (!show) {
        document.getElementById('areaPredOverlay').checked = false;
        document.getElementById('pathPredOverlay').checked = false;
      }
    });

    // Unified auto-reload: one timer calls both sides.
    let unifiedReloadTimer = null;
    document.getElementById('reloadInterval').addEventListener('change', function () {
      if (unifiedReloadTimer) clearInterval(unifiedReloadTimer);
      const secs = Number(this.value);
      if (secs > 0) {
        unifiedReloadTimer = setInterval(() => {
          mapLoadSpots();
          tableLoadSpots();
        }, secs * 1000);
      }
    });
  </script>

</body>
</html>
